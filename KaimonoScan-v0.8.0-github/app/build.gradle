plugins { id 'com.android.application' }
def useCommunityBuild = (project.findProperty('communityBuild') ?: 'true').toBoolean()
android {
 namespace 'dev.enadorry.kaimonoscan'
 compileSdk 35
 defaultConfig {
  applicationId 'dev.enadorry.kaimonoscan'
  if (useCommunityBuild) applicationIdSuffix '.community'
  manifestPlaceholders = [appLabel: useCommunityBuild ? 'かいものスキャン 共有版' : 'かいものスキャン']
  minSdk 24; targetSdk 35; versionCode 18; versionName '0.8.0'
 }
 signingConfigs { debug { if (System.getenv('KAIMONO_DEBUG_KEYSTORE')) storeFile file(System.getenv('KAIMONO_DEBUG_KEYSTORE')) } }

 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
 implementation 'com.google.android.material:material:1.12.0'
 implementation 'org.jsoup:jsoup:1.18.3'
 implementation 'androidx.activity:activity:1.9.3'
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
android { testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true } }
dependencies {
 testImplementation 'org.robolectric:robolectric:4.14.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}

android { sourceSets { test.resources.srcDirs += "src/main/assets" } }
